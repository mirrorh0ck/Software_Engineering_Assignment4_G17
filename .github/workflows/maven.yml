# CI workflow for the Intelligent Bus Driver Guidance System.
# Runs the full Maven test suite (50 tests) every time we push or open a PR.
# The Maven project lives inside the BusDriverGuidanceSystem subfolder.

name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu, JDK 17)
    runs-on: ubuntu-latest

    # all maven commands run from the project subfolder
    defaults:
      run:
        working-directory: BusDriverGuidanceSystem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Show toolchain versions
        run: |
          java -version
          mvn -v

      - name: Compile
        run: mvn -B -ntp clean compile test-compile

      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: BusDriverGuidanceSystem/target/surefire-reports/
          if-no-files-found: ignore
